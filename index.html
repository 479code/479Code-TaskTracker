<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>479Code Task Tracker</title>
<link rel="icon" type="image/jpeg" href="assets/479-logo.jpeg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0c0f12; --panel:#14181d; --panel-2:#1a1f26; --line:#262c34;
    --text:#e8ebee; --muted:#8b95a1; --accent:#ff8a3d; --accent-dim:#3a2a1c;
    --done:#3ddc97; --done-dim:#15302a; --prog:#ffd166; --prog-dim:#332c14;
    --danger:#ff5c5c; --owner:#a78bfa;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);padding:0 0 60px;}
  .wrap{max-width:920px;margin:0 auto;padding:24px 18px;}
  a{color:var(--accent);}
  input,select,textarea,button{font-family:var(--sans);}

  /* ---------- Logo ---------- */
  .logo-svg{display:block;}
  .logo-svg .bar{transform-box:fill-box;transform-origin:bottom;animation:barGrow .55s cubic-bezier(.2,.8,.2,1) both;}
  .logo-svg .strip{opacity:0;animation:fadeUp .5s ease .55s both;}
  .logo-svg.idle .bar{animation:barGrow .55s cubic-bezier(.2,.8,.2,1) both, barIdle 2.6s ease-in-out infinite;}
  .logo-svg .bar:nth-child(1){animation-delay:0s;} .logo-svg .bar:nth-child(2){animation-delay:.05s;}
  .logo-svg .bar:nth-child(3){animation-delay:.1s;} .logo-svg .bar:nth-child(4){animation-delay:.15s;}
  .logo-svg .bar:nth-child(5){animation-delay:.2s;} .logo-svg .bar:nth-child(6){animation-delay:.25s;}
  .logo-svg .bar:nth-child(7){animation-delay:.3s;} .logo-svg .bar:nth-child(8){animation-delay:.35s;}
  .logo-svg .bar:nth-child(9){animation-delay:.4s;}
  @keyframes barGrow{from{transform:scaleY(0);} to{transform:scaleY(1);}}
  @keyframes barIdle{0%,100%{transform:scaleY(1);} 50%{transform:scaleY(.94);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);}}
  .auth-logo{width:170px;height:auto;margin-bottom:4px;}
  .header-logo{width:40px;height:auto;flex:none;}

  /* ---------- Auth screen ---------- */
  #authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;}
  #authScreen .eyebrow{margin:0;}
  #authScreen h2{margin:0;font-size:18px;font-weight:650;}
  .authbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;width:100%;max-width:340px;}
  .authtabs{display:flex;gap:4px;background:var(--panel-2);border-radius:8px;padding:3px;margin-bottom:16px;}
  .authtabs button{flex:1;background:none;border:none;color:var(--muted);padding:8px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600;}
  .authtabs button.active{background:var(--accent);color:#1a1206;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-family:var(--mono);}
  .field input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:9px 10px;font-size:14px;outline:none;}
  .field input:focus{border-color:var(--accent);}
  .authsubmit{width:100%;background:var(--accent);color:#1a1206;border:none;border-radius:6px;padding:10px;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;}
  .authsubmit:disabled{opacity:.6;}
  .autherr{color:var(--danger);font-size:12px;margin-top:8px;min-height:14px;}
  .authmsg{color:var(--done);font-size:12px;margin-top:8px;}

  /* ---------- App shell ---------- */
  #appRoot{display:none;animation:fadeIn .4s ease both;}
  header.app{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin:0 0 4px;}
  h1{margin:0;font-size:20px;font-weight:650;}
  .userbar{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted);}
  .userbar button{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:11px;padding:6px 10px;border-radius:6px;cursor:pointer;}
  .userbar button:hover{color:var(--text);border-color:var(--accent);}
  .notif-wrap{position:relative;}
  .notif-badge{background:var(--danger);color:#fff;border-radius:20px;font-size:9.5px;padding:1px 5px;margin-left:3px;font-weight:700;}
  .notif-dropdown{display:none;position:absolute;right:0;top:calc(100% + 8px);width:320px;max-height:420px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .notif-dropdown.open{display:block;}
  .notif-item{padding:10px;border-radius:8px;margin-bottom:4px;background:var(--panel-2);}
  .notif-item.unread{border-left:3px solid var(--accent);}
  .notif-text{font-size:12.5px;line-height:1.4;color:var(--text);}
  .notif-time{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;}
  .notif-actions{display:flex;gap:6px;margin-top:8px;}
  .notif-actions button{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:none;color:var(--text);cursor:pointer;}
  .notif-actions button.accept{background:var(--done-dim);color:var(--done);border-color:var(--done);}
  .notif-actions button.reject{background:#2a1414;color:var(--danger);border-color:var(--danger);}
  .notif-empty{text-align:center;color:var(--muted);font-size:12px;padding:20px;font-family:var(--mono);}

  .addbar input[type=date]{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:0 8px;font-size:12px;}
  .tl-item{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;align-items:center;animation:fadeIn .3s ease both;}
  .tl-date{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:90px;flex:none;}
  .tl-date.overdue{color:var(--danger);font-weight:700;}
  .tl-date.soon{color:var(--prog);font-weight:700;}
  .tl-bar{flex:1;height:6px;border-radius:4px;background:var(--panel-2);position:relative;overflow:hidden;}
  .tl-bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent);}
  .tl-title{flex:2;font-size:13.5px;}
  .tl-title.done{text-decoration:line-through;color:var(--muted);}

  .banner{background:#2a1414;border:1px solid #4a2222;color:#ffb3b3;padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:16px;display:none;}
  .banner.ok{background:#142a1f;border-color:#225e3c;color:#a8f0c6;}

  /* ---------- Projects grid ---------- */
  .section-title{font-size:13px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 10px;}
  .addbar{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:18px;}
  .addbar input[type=text],.addbar textarea{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;padding:8px 10px;outline:none;}
  .addbar button{background:var(--accent);color:#1a1206;border:none;border-radius:6px;padding:0 16px;font-weight:700;font-size:13px;cursor:pointer;}
  .addbar select{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;font-size:12px;padding:0 8px;}

  .projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
  .project-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s, transform .15s;animation:fadeIn .3s ease both;}
  .project-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .project-card h3{margin:0 0 6px;font-size:15px;}
  .project-card p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.4;}
  .project-card .pc-meta{display:flex;gap:8px;margin-top:10px;font-family:var(--mono);font-size:10.5px;color:var(--muted);}
  .rolepill{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);}
  .rolepill.owner{color:var(--owner);border-color:var(--owner);}

  /* ---------- Project detail ---------- */
  .backbtn{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:12px;cursor:pointer;margin-bottom:14px;padding:0;}
  .backbtn:hover{color:var(--accent);}
  .project-head h2{margin:0 0 4px;font-size:22px;}
  .project-head p{margin:0;color:var(--muted);font-size:13px;}

  .tabs{display:flex;gap:6px;margin:18px 0 16px;border-bottom:1px solid var(--line);}
  .tabs button{background:none;border:none;color:var(--muted);font-size:13px;padding:9px 4px;margin-right:18px;cursor:pointer;border-bottom:2px solid transparent;font-weight:600;}
  .tabs button.active{color:var(--accent);border-color:var(--accent);}
  .tabpane{display:none;}
  .tabpane.active{display:block;animation:fadeIn .25s ease both;}

  /* ---------- Tasks ---------- */
  .task{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;animation:fadeIn .3s ease both;}
  .task.done{opacity:.55;}
  .task-row{display:flex;align-items:flex-start;gap:12px;}
  .chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--panel-2);transition:transform .15s;}
  .chk:active{transform:scale(.88);}
  .chk.checked{background:var(--done);border-color:var(--done);}
  .chk.checked:after{content:'✓';color:#0c0f12;font-size:13px;font-weight:900;}
  .task-body{flex:1;min-width:0;}
  .task-title{font-size:14.5px;line-height:1.4;word-break:break-word;}
  .task.done .task-title{text-decoration:line-through;color:var(--muted);}
  .task-meta{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;padding:2px 8px;border-radius:20px;text-transform:uppercase;}
  .tag.todo{background:var(--panel-2);color:var(--muted);border:1px solid var(--line);}
  .tag.progress{background:var(--prog-dim);color:var(--prog);}
  .tag.done{background:var(--done-dim);color:var(--done);}
  .status-cycle,.assign-select,.exp-btn{font-family:var(--mono);font-size:10.5px;background:none;border:1px solid var(--line);color:var(--muted);padding:2px 8px;border-radius:20px;cursor:pointer;}
  .assign-select{background:var(--panel-2);color:var(--text);padding:2px 6px;}
  .status-cycle:hover,.exp-btn:hover{border-color:var(--accent);color:var(--accent);}
  .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px;flex:none;}
  .del:hover{color:var(--danger);}

  .progress-bar{height:5px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-top:8px;}
  .progress-fill{height:100%;background:var(--done);transition:width .3s ease;border-radius:4px;}
  .progress-label{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;}

  .subtasks{margin-top:12px;padding-left:14px;border-left:2px solid var(--line);display:none;}
  .subtasks.open{display:block;}
  .subtask{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);}
  .subtask:last-child{border-bottom:none;}
  .subtask .task-title{font-size:13px;}
  .subaddbar{display:flex;gap:6px;margin-top:8px;}
  .subaddbar input{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12.5px;outline:none;}
  .subaddbar button{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 10px;font-size:12px;cursor:pointer;}

  /* ---------- Notes ---------- */
  .note{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;animation:fadeIn .3s ease both;}
  .note-text{font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .note-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px;}
  .note-author{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .note-actions{display:flex;gap:8px;}
  .note-actions button{font-family:var(--mono);font-size:10.5px;background:none;border:1px solid var(--line);color:var(--muted);padding:3px 9px;border-radius:20px;cursor:pointer;}
  .note-actions button:hover{border-color:var(--accent);color:var(--accent);}
  .note-converted{font-family:var(--mono);font-size:10.5px;color:var(--done);}

  /* ---------- Members ---------- */
  .member-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .member-info{display:flex;flex-direction:column;}
  .member-email{font-size:13.5px;}
  .member-role{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
  .invite-row{display:flex;gap:8px;margin-bottom:18px;}
  .invite-row input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13.5px;outline:none;}
  .invite-row select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:0 10px;font-size:12.5px;}
  .invite-row button{background:var(--accent);color:#1a1206;border:none;border-radius:8px;padding:0 16px;font-weight:700;cursor:pointer;}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 0;font-family:var(--mono);}
  footer{text-align:center;color:var(--muted);font-size:11px;font-family:var(--mono);margin-top:30px;}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen">
  <svg class="logo-svg auth-logo idle" viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg">
    <g fill="#e8ebee">
      <rect class="bar" x="195" y="60" width="40" height="320"/><rect class="bar" x="250" y="115" width="18" height="265"/>
      <rect class="bar" x="283" y="92" width="28" height="288"/><rect class="bar" x="326" y="118" width="22" height="262"/>
      <rect class="bar" x="363" y="168" width="34" height="212"/><rect class="bar" x="412" y="120" width="22" height="260"/>
      <rect class="bar" x="450" y="58" width="38" height="322"/><rect class="bar" x="503" y="205" width="16" height="175"/>
      <rect class="bar" x="534" y="78" width="34" height="302"/>
    </g>
    <g class="strip">
      <rect x="40" y="380" width="528" height="86" fill="#9aa0a6" rx="3"/>
      <text x="62" y="442" font-family="monospace" font-weight="800" font-size="58" fill="#14181d">479</text>
      <text x="556" y="442" text-anchor="end" font-family="monospace" font-weight="800" font-size="58" fill="#14181d" letter-spacing="2">CODE</text>
    </g>
  </svg>
  <p class="eyebrow">479Code · Operations</p>
  <div class="authbox">
    <div class="authtabs">
      <button id="tabSignIn" class="active">Sign in</button>
      <button id="tabSignUp">Sign up</button>
    </div>
    <div id="fullNameField" class="field" style="display:none;">
      <label>Full name</label>
      <input type="text" id="fullNameInput" placeholder="Your name" autocomplete="name">
    </div>
    <div id="usernameField" class="field" style="display:none;">
      <label>Username</label>
      <input type="text" id="usernameInput" placeholder="e.g. amaka479" autocomplete="off">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="emailInput" placeholder="you@479code.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="authsubmit" id="authSubmit">Sign in</button>
    <div class="autherr" id="authErr"></div>
    <div class="authmsg" id="authMsg"></div>
  </div>
</div>

<!-- ============ APP ROOT ============ -->
<div id="appRoot">
<div class="wrap">

  <header class="app">
    <div class="brand" id="brandHome">
      <svg class="logo-svg header-logo" viewBox="0 0 600 520" xmlns="http://www.w3.org/2000/svg">
        <g fill="var(--accent)">
          <rect class="bar" x="195" y="60" width="40" height="320"/><rect class="bar" x="250" y="115" width="18" height="265"/>
          <rect class="bar" x="283" y="92" width="28" height="288"/><rect class="bar" x="326" y="118" width="22" height="262"/>
          <rect class="bar" x="363" y="168" width="34" height="212"/><rect class="bar" x="412" y="120" width="22" height="260"/>
          <rect class="bar" x="450" y="58" width="38" height="322"/><rect class="bar" x="503" y="205" width="16" height="175"/>
          <rect class="bar" x="534" y="78" width="34" height="302"/>
        </g>
        <g class="strip">
          <rect x="40" y="380" width="528" height="86" fill="#9aa0a6" rx="3"/>
          <text x="62" y="442" font-family="monospace" font-weight="800" font-size="58" fill="#14181d">479</text>
          <text x="556" y="442" text-anchor="end" font-family="monospace" font-weight="800" font-size="58" fill="#14181d" letter-spacing="2">CODE</text>
        </g>
      </svg>
      <div>
        <p class="eyebrow">479Code · Operations</p>
        <h1>Task Tracker</h1>
      </div>
    </div>
    <div class="userbar">
      <button id="refreshBtn" title="Refresh">⟳ Refresh</button>
      <div class="notif-wrap">
        <button id="usernameBtn">Set username</button>
        <div class="notif-dropdown" id="usernameDropdown">
          <div class="field" style="margin:4px 4px 8px;">
            <label>Username</label>
            <input type="text" id="usernameEditInput" placeholder="e.g. amaka479" style="width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px;outline:none;">
          </div>
          <button id="usernameSaveBtn" style="width:100%;background:var(--accent);color:#1a1206;border:none;border-radius:6px;padding:8px;font-weight:700;cursor:pointer;">Save</button>
          <div id="usernameMsg" style="font-size:11px;margin-top:6px;min-height:14px;font-family:var(--mono);"></div>
        </div>
      </div>
      <div class="notif-wrap">
        <button id="notifBtn">🔔 <span id="notifBadge" class="notif-badge" style="display:none;">0</span></button>
        <div class="notif-dropdown" id="notifDropdown"></div>
      </div>
      <span id="userEmail"></span>
      <button id="signOutBtn">Sign out</button>
    </div>
  </header>

  <div class="banner" id="errBanner"></div>

  <!-- PROJECTS LIST VIEW -->
  <div id="projectsView">
    <div class="addbar">
      <input type="text" id="newProjectName" placeholder="New project name…">
      <button id="addProjectBtn">Create project</button>
    </div>
    <div class="section-title">Your projects</div>
    <div class="projects-grid" id="projectsGrid"></div>
    <div class="empty" id="projectsEmpty" style="display:none;">No projects yet — create your first one above.</div>
  </div>

  <!-- PROJECT DETAIL VIEW -->
  <div id="projectView" style="display:none;">
    <button class="backbtn" id="backBtn">← All projects</button>
    <div class="project-head">
      <h2 id="projectName"></h2>
      <p id="projectDesc"></p>
    </div>

    <div class="tabs">
      <button class="tabbtn active" data-tab="tasks">Tasks</button>
      <button class="tabbtn" data-tab="timeline">Timeline</button>
      <button class="tabbtn" data-tab="notes">Notes</button>
      <button class="tabbtn" data-tab="members">Members</button>
    </div>

    <div class="tabpane active" id="pane-tasks">
      <div class="addbar">
        <input type="text" id="newTaskInput" placeholder="Add a task…">
        <select id="newTaskAssignee"><option value="">Unassigned</option></select>
        <input type="date" id="newTaskDue" title="Due date (optional)">
        <button id="addTaskBtn">Add</button>
      </div>
      <div id="taskList"></div>
      <div class="empty" id="tasksEmpty" style="display:none;">No tasks yet — add one above.</div>
    </div>

    <div class="tabpane" id="pane-timeline">
      <div id="timelineList"></div>
      <div class="empty" id="timelineEmpty" style="display:none;">No tasks with due dates yet — add due dates to tasks to see them here.</div>
    </div>

    <div class="tabpane" id="pane-notes">
      <div class="addbar">
        <textarea id="newNoteInput" placeholder="Meeting note… e.g. Client wants invoice export by Friday" rows="2"></textarea>
        <button id="addNoteBtn">Add note</button>
      </div>
      <div id="noteList"></div>
      <div class="empty" id="notesEmpty" style="display:none;">No notes yet.</div>
    </div>

    <div class="tabpane" id="pane-members">
      <div class="invite-row">
        <input type="text" id="inviteEmail" placeholder="Teammate's email or @username (must have an account already)">
        <select id="inviteRole">
          <option value="editor">Editor</option>
          <option value="viewer">Viewer</option>

  <footer>backed by Supabase · real-time team data</footer>
</div>

<script>
const SUPABASE_URL = 'https://ztkdzudunwlhkrclejot.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6okFPeT8x7zuDN_kSF6jyA_XoJOhPEt';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProject = null;
let projectMembers = [];
let profilesCache = {};

/* ---------------- AUTH ---------------- */
let authMode = 'signin';

document.getElementById('tabSignIn').onclick = () => setAuthMode('signin');
document.getElementById('tabSignUp').onclick = () => setAuthMode('signup');

function setAuthMode(mode){
  authMode = mode;
  document.getElementById('tabSignIn').classList.toggle('active', mode==='signin');
  document.getElementById('tabSignUp').classList.toggle('active', mode==='signup');
  document.getElementById('fullNameField').style.display = mode==='signup' ? 'block' : 'none';
  document.getElementById('usernameField').style.display = mode==='signup' ? 'block' : 'none';
  document.getElementById('authSubmit').textContent = mode==='signin' ? 'Sign in' : 'Create account';
  document.getElementById('authErr').textContent = '';
  document.getElementById('authMsg').textContent = '';
}

document.getElementById('authSubmit').onclick = async () => {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const fullName = document.getElementById('fullNameInput').value.trim();
  const username = document.getElementById('usernameInput').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  const err = document.getElementById('authErr');
  const msg = document.getElementById('authMsg');
  err.textContent = ''; msg.textContent = '';

  if(!email || !password){ err.textContent = 'Email and password required.'; return; }

  const btn = document.getElementById('authSubmit');
  btn.disabled = true;

  if(authMode === 'signup'){
    if(username){
      const { data: existing } = await sb.from('profiles').select('id').eq('username', username).maybeSingle();
      if(existing){ err.textContent = 'That username is taken — try another.'; btn.disabled = false; return; }
    }
    const { data, error } = await sb.auth.signUp({
      email, password,
      options: { data: { full_name: fullName || email.split('@')[0] } }
    });
    if(error){ err.textContent = error.message; btn.disabled = false; return; }
    const newUserId = data.user?.id;
    if(newUserId && username){
      // profile row may take a moment to be created by the trigger; retry briefly
      for(let i=0;i<5;i++){
        const { error: upErr } = await sb.from('profiles').update({ username }).eq('id', newUserId);
        if(!upErr) break;
        await new Promise(r=>setTimeout(r,400));
      }
    }
    if(data.session){
      await onLoggedIn();
    } else {
      msg.textContent = 'Account created — check your email to confirm, then sign in.';
      setAuthMode('signin');
    }
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ err.textContent = error.message; btn.disabled = false; return; }
    await onLoggedIn();
  }
  btn.disabled = false;
};

document.getElementById('signOutBtn').onclick = async () => {
  await sb.auth.signOut();
  location.reload();
};

async function onLoggedIn(){
  const { data: { user } } = await sb.auth.getUser();
  currentUser = user;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'block';
  document.getElementById('userEmail').textContent = user.email;
  await loadProjects();
  await refreshUsernameButton();
  await checkDueReminders();
  await loadNotifications();
  setInterval(loadNotifications, 30000);
}

async function refreshUsernameButton(){
  const profile = await getProfile(currentUser.id);
  const btn = document.getElementById('usernameBtn');
  btn.textContent = profile?.username ? '@'+profile.username : 'Set username';
  document.getElementById('usernameEditInput').value = profile?.username || '';
}

document.getElementById('usernameBtn').onclick = (e) => {
  e.stopPropagation();
  document.getElementById('notifDropdown').classList.remove('open');
  document.getElementById('usernameDropdown').classList.toggle('open');
};
document.addEventListener('click', (e) => {
  if(!e.target.closest('.notif-wrap')) document.getElementById('usernameDropdown')?.classList.remove('open');
});

document.getElementById('usernameSaveBtn').onclick = async () => {
  const raw = document.getElementById('usernameEditInput').value.trim().toLowerCase();
  const username = raw.replace(/[^a-z0-9_]/g,'');
  const msg = document.getElementById('usernameMsg');
  msg.style.color = 'var(--danger)';
  if(!username || username.length < 3){ msg.textContent = 'At least 3 characters (letters, numbers, _).'; return; }

  const { data: existing } = await sb.from('profiles').select('id').eq('username', username).maybeSingle();
  if(existing && existing.id !== currentUser.id){ msg.textContent = 'That username is taken.'; return; }

  const { error } = await sb.from('profiles').update({ username }).eq('id', currentUser.id);
  if(error){ msg.textContent = error.message; return; }

  delete profilesCache[currentUser.id];
  msg.style.color = 'var(--done)';
  msg.textContent = 'Saved!';
  await refreshUsernameButton();
  setTimeout(()=>{ document.getElementById('usernameDropdown').classList.remove('open'); }, 800);
};

document.getElementById('refreshBtn').onclick = async () => {
  const btn = document.getElementById('refreshBtn');
  btn.textContent = '⟳ Refreshing…';
  if(document.getElementById('projectView').style.display !== 'none' && currentProject){
    await loadMembers(); await loadTasks(); await loadNotes();
  } else {
    await loadProjects();
  }
  await checkDueReminders();
  await loadNotifications();
  btn.textContent = '⟳ Refresh';
};

document.getElementById('notifBtn').onclick = (e) => {
  e.stopPropagation();
  const dd = document.getElementById('notifDropdown');
  dd.classList.toggle('open');
  if(dd.classList.contains('open')) loadNotifications();
};
document.addEventListener('click', (e) => {
  const dd = document.getElementById('notifDropdown');
  if(!e.target.closest('.notif-wrap')) dd.classList.remove('open');
});

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await onLoggedIn(); }
})();

/* ---------------- HELPERS ---------------- */
function showError(msg){
  const b = document.getElementById('errBanner');
  b.className = 'banner';
  b.textContent = msg;
  b.style.display = 'block';
  setTimeout(()=>{ b.style.display='none'; }, 4000);
}
function showOk(msg){
  const b = document.getElementById('errBanner');
  b.className = 'banner ok';
  b.textContent = msg;
  b.style.display = 'block';
  setTimeout(()=>{ b.style.display='none'; }, 3000);
}
async function getProfile(userId){
  if(profilesCache[userId]) return profilesCache[userId];
  const { data } = await sb.from('profiles').select('*').eq('id', userId).single();
  if(data) profilesCache[userId] = data;
  return data;
}

/* ---------------- PROJECTS ---------------- */
document.getElementById('addProjectBtn').onclick = async () => {
  const input = document.getElementById('newProjectName');
  const name = input.value.trim();
  if(!name) return;
  const { error } = await sb.from('projects').insert({ name, created_by: currentUser.id });
  if(error){ showError(error.message); return; }
  input.value = '';
  await loadProjects();
};

document.getElementById('brandHome').onclick = () => {
  document.getElementById('projectView').style.display = 'none';
  document.getElementById('projectsView').style.display = 'block';
  loadProjects();
};
document.getElementById('backBtn').onclick = () => {
  document.getElementById('projectView').style.display = 'none';
  document.getElementById('projectsView').style.display = 'block';
};

async function loadProjects(){
  const { data: memberships, error } = await sb
    .from('project_members')
    .select('role, projects(*)')
    .eq('user_id', currentUser.id);

  if(error){ showError(error.message); return; }

  const grid = document.getElementById('projectsGrid');
  const empty = document.getElementById('projectsEmpty');
  grid.innerHTML = '';
  empty.style.display = (!memberships || memberships.length===0) ? 'block' : 'none';

  (memberships||[]).forEach(m => {
    if(!m.projects) return;
    const card = document.createElement('div');
    card.className = 'project-card';
    card.innerHTML = `
      <h3>${escapeHtml(m.projects.name)}</h3>
      <p>${escapeHtml(m.projects.description || 'No description yet')}</p>
      <div class="pc-meta"><span class="rolepill ${m.role==='owner'?'owner':''}">${m.role}</span></div>
    `;
    card.onclick = () => openProject(m.projects, m.role);
    grid.appendChild(card);
  });
}

async function openProject(project, role){
  currentProject = { ...project, myRole: role };
  document.getElementById('projectsView').style.display = 'none';
  document.getElementById('projectView').style.display = 'block';
  document.getElementById('projectName').textContent = project.name;
  document.getElementById('projectDesc').textContent = project.description || '';
  switchTab('tasks');
  await loadMembers();
  await loadTasks();
  await loadNotes();
  await loadPendingInvites();
  await loadTimeline();
}

/* ---------------- TABS ---------------- */
document.querySelectorAll('.tabbtn').forEach(btn => {
  btn.onclick = () => switchTab(btn.dataset.tab);
});
function switchTab(tab){
  document.querySelectorAll('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tabpane').forEach(p => p.classList.toggle('active', p.id === 'pane-'+tab));
}

/* ---------------- MEMBERS ---------------- */
async function loadMembers(){
  const { data, error } = await sb
    .from('project_members')
    .select('role, user_id, profiles(*)')
    .eq('project_id', currentProject.id);
  if(error){ showError(error.message); return; }
  projectMembers = data || [];

  const list = document.getElementById('memberList');
  list.innerHTML = '';
  projectMembers.forEach(m => {
    const row = document.createElement('div');
    row.className = 'member-row';
    const isMe = m.user_id === currentUser.id;
    row.innerHTML = `
      <div class="member-info">
        <span class="member-email">${escapeHtml(m.profiles?.full_name || m.profiles?.email || 'Unknown')} ${isMe?'(you)':''}</span>
        <span class="member-role">${escapeHtml(m.profiles?.email||'')} · ${m.role}</span>
      </div>
    `;
    if(currentProject.myRole === 'owner' && !isMe){
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.onclick = async () => {
        await sb.from('project_members').delete().eq('project_id', currentProject.id).eq('user_id', m.user_id);
        await loadMembers();
      };
      row.appendChild(del);
    }
    list.appendChild(row);
  });

  // populate assignee dropdowns
  const assignSel = document.getElementById('newTaskAssignee');
  assignSel.innerHTML = '<option value="">Unassigned</option>';
  projectMembers.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m.user_id;
    opt.textContent = m.profiles?.full_name || m.profiles?.email;
    assignSel.appendChild(opt);
  });

  document.getElementById('inviteBtn').style.display = currentProject.myRole === 'owner' ? 'block' : 'none';
  document.querySelector('.invite-row').style.display = currentProject.myRole === 'owner' ? 'flex' : 'none';
}

document.getElementById('inviteBtn').onclick = async () => {
  const handle = document.getElementById('inviteEmail').value.trim();
  const role = document.getElementById('inviteRole').value;
  if(!handle) return;
  const lookup = handle.includes('@')
    ? sb.from('profiles').select('*').eq('email', handle).maybeSingle()
    : sb.from('profiles').select('*').eq('username', handle.toLowerCase().replace(/^@/,'')).maybeSingle();
  const { data: profile, error: pErr } = await lookup;
  if(pErr || !profile){ showError('No account found with that email/username — they need to sign up first.'); return; }
  if(profile.id === currentUser.id){ showError("That's you."); return; }
  const already = projectMembers.find(m => m.user_id === profile.id);
  if(already){ showError('Already a member of this project.'); return; }
  const { error } = await sb.from('project_invites').insert({
    project_id: currentProject.id, invited_user_id: profile.id, invited_by: currentUser.id, role
  });
  if(error){
    if(error.message.includes('duplicate')) showError('They already have a pending invite.');
    else showError(error.message);
    return;
  }
  document.getElementById('inviteEmail').value = '';
  showOk('Invite sent to ' + (profile.full_name || profile.email) + ' — pending their acceptance');
  await loadPendingInvites();
};

async function loadPendingInvites(){
  if(currentProject.myRole !== 'owner') return;
  const { data } = await sb.from('project_invites')
    .select('*, profiles:invited_user_id(*)')
    .eq('project_id', currentProject.id).eq('status','pending');
  const wrap = document.getElementById('pendingInvitesList');
  if(!wrap) return;
  wrap.innerHTML = '';
  (data||[]).forEach(inv => {
    const row = document.createElement('div');
    row.className = 'member-row';
    row.innerHTML = `
      <div class="member-info">
        <span class="member-email">${escapeHtml(inv.profiles?.full_name || inv.profiles?.email)}</span>
        <span class="member-role">pending · invited as ${inv.role}</span>
      </div>
    `;
    const cancel = document.createElement('button');
    cancel.className = 'del';
    cancel.textContent = '✕';
    cancel.title = 'Cancel invite';
    cancel.onclick = async () => { await sb.from('project_invites').delete().eq('id', inv.id); await loadPendingInvites(); };
    row.appendChild(cancel);
    wrap.appendChild(row);
  });
}

/* ---------------- NOTIFICATIONS ---------------- */
async function loadNotifications(){
  const { data, error } = await sb.from('notifications')
    .select('*, projects(name)')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending:false })
    .limit(30);
  if(error) return;

  const unread = (data||[]).filter(n=>!n.read).length;
  const badge = document.getElementById('notifBadge');
  badge.textContent = unread;
  badge.style.display = unread > 0 ? 'inline-block' : 'none';

  const dd = document.getElementById('notifDropdown');
  dd.innerHTML = '';
  if(!data || data.length===0){
    dd.innerHTML = '<div class="notif-empty">No notifications yet.</div>';
    return;
  }

  for(const n of data){
    const item = document.createElement('div');
    item.className = 'notif-item' + (n.read ? '' : ' unread');
    item.innerHTML = `
      <div class="notif-text">${escapeHtml(n.content)}</div>
      <div class="notif-time">${new Date(n.created_at).toLocaleString()}</div>
    `;
    if(n.type === 'invite'){
      const { data: invite } = await sb.from('project_invites').select('status').eq('id', n.invite_id).maybeSingle();
      if(invite && invite.status === 'pending'){
        const actions = document.createElement('div');
        actions.className = 'notif-actions';
        actions.innerHTML = `<button class="accept">Accept</button><button class="reject">Reject</button>`;
        actions.querySelector('.accept').onclick = async () => { await respondInvite(n.invite_id, 'accepted'); };
        actions.querySelector('.reject').onclick = async () => { await respondInvite(n.invite_id, 'rejected'); };
        item.appendChild(actions);
      }
    }
    item.onclick = async (e) => {
      if(e.target.tagName === 'BUTTON') return;
      if(!n.read){ await sb.from('notifications').update({ read:true }).eq('id', n.id); n.read = true; item.classList.remove('unread'); }
    };
    dd.appendChild(item);
  }
}

async function respondInvite(inviteId, status){
  const { error } = await sb.from('project_invites').update({ status, responded_at: new Date().toISOString() }).eq('id', inviteId);
  if(error){ showError(error.message); return; }
  showOk(status === 'accepted' ? 'Joined the project!' : 'Invite declined');
  await loadNotifications();
  await loadProjects();
}

async function checkDueReminders(){
  const { data: memberships } = await sb.from('project_members').select('project_id').eq('user_id', currentUser.id);
  const projectIds = (memberships||[]).map(m=>m.project_id);
  if(projectIds.length===0) return;

  const soon = new Date(); soon.setDate(soon.getDate()+2);
  const soonStr = soon.toISOString().slice(0,10);

  const { data: dueTasks } = await sb.from('tasks')
    .select('*')
    .in('project_id', projectIds)
    .not('due_date','is',null)
    .neq('status','done')
    .lte('due_date', soonStr);

  if(!dueTasks) return;
  const todayStr = new Date().toISOString().slice(0,10);

  for(const t of dueTasks){
    const { data: existing } = await sb.from('notifications')
      .select('id').eq('task_id', t.id).eq('type','due_reminder').eq('user_id', currentUser.id)
      .gte('created_at', todayStr).maybeSingle();
    if(existing) continue;
    const overdue = t.due_date < todayStr;
    await sb.from('notifications').insert({
      user_id: currentUser.id, type: 'due_reminder', project_id: t.project_id, task_id: t.id,
      content: (overdue ? '⚠️ Overdue: ' : '⏰ Due soon: ') + '"' + t.title + '"' + (overdue ? '' : ' (due ' + t.due_date + ')')
    });
  }
}

/* ---------------- TASKS & SUBTASKS ---------------- */
function assigneeName(id){
  if(!id) return null;
  const m = projectMembers.find(x => x.user_id === id);
  return m ? (m.profiles?.full_name || m.profiles?.email) : null;
}

document.getElementById('addTaskBtn').onclick = async () => {
  const input = document.getElementById('newTaskInput');
  const assignee = document.getElementById('newTaskAssignee').value || null;
  const dueInput = document.getElementById('newTaskDue');
  const due = dueInput.value || null;
  const title = input.value.trim();
  if(!title) return;
  const { error } = await sb.from('tasks').insert({
    project_id: currentProject.id, title, assignee_id: assignee, due_date: due, created_by: currentUser.id
  });
  if(error){ showError(error.message); return; }
  input.value = '';
  dueInput.value = '';
  await loadTasks();
  await loadTimeline();
};

async function loadTimeline(){
  const { data, error } = await sb.from('tasks')
    .select('*')
    .eq('project_id', currentProject.id)
    .order('due_date', { ascending: true, nullsFirst: false });
  if(error) return;

  const withDue = (data||[]).filter(t => t.due_date);
  const list = document.getElementById('timelineList');
  const empty = document.getElementById('timelineEmpty');
  list.innerHTML = '';
  empty.style.display = withDue.length === 0 ? 'block' : 'none';

  if(withDue.length === 0) return;
  const todayStr = new Date().toISOString().slice(0,10);
  const soon = new Date(); soon.setDate(soon.getDate()+2);
  const soonStr = soon.toISOString().slice(0,10);

  const minDate = withDue[0].due_date;
  const maxDate = withDue[withDue.length-1].due_date;
  const span = Math.max(1, (new Date(maxDate) - new Date(minDate)) / 86400000);

  withDue.forEach(t => {
    const overdue = t.status !== 'done' && t.due_date < todayStr;
    const soonFlag = t.status !== 'done' && t.due_date >= todayStr && t.due_date <= soonStr;
    const pct = Math.min(100, Math.max(2, ((new Date(t.due_date) - new Date(minDate)) / 86400000 / span) * 100));
    const row = document.createElement('div');
    row.className = 'tl-item';
    row.innerHTML = `
      <span class="tl-date ${overdue?'overdue':soonFlag?'soon':''}">${t.due_date}</span>
      <span class="tl-title ${t.status==='done'?'done':''}">${escapeHtml(t.title)}</span>
      <div class="tl-bar"><div class="tl-bar-fill" style="width:${pct}%; background:${t.status==='done' ? 'var(--done)' : overdue ? 'var(--danger)' : soonFlag ? 'var(--prog)' : 'var(--accent)'}"></div></div>
    `;
    list.appendChild(row);
  });
}

async function loadTasks(){
  const { data, error } = await sb.from('tasks').select('*').eq('project_id', currentProject.id).order('created_at');
  if(error){ showError(error.message); return; }

  const topTasks = (data||[]).filter(t => !t.parent_task_id);
  const subtasksByParent = {};
  (data||[]).filter(t => t.parent_task_id).forEach(t => {
    (subtasksByParent[t.parent_task_id] = subtasksByParent[t.parent_task_id]||[]).push(t);
  });

  const list = document.getElementById('taskList');
  const empty = document.getElementById('tasksEmpty');
  list.innerHTML = '';
  empty.style.display = topTasks.length === 0 ? 'block' : 'none';

  const order = {progress:0, todo:1, done:2};
  topTasks.sort((a,b)=> (order[a.status]??1)-(order[b.status]??1));

  topTasks.forEach(t => {
    const subs = subtasksByParent[t.id] || [];
    const doneCount = subs.filter(s=>s.status==='done').length;
    const row = document.createElement('div');
    row.className = 'task' + (t.status==='done' ? ' done':'');

    const aName = assigneeName(t.assignee_id);

    row.innerHTML = `
      <div class="task-row">
        <div class="chk ${t.status==='done'?'checked':''}" data-id="${t.id}"></div>
        <div class="task-body">
          <div class="task-title">${escapeHtml(t.title)}</div>
          <div class="task-meta">
            <span class="tag ${t.status==='done'?'done':t.status==='progress'?'progress':'todo'}">${statusLabel(t.status)}</span>
            <button class="status-cycle" data-cycle="${t.id}">Change status →</button>
            ${aName ? `<span class="tag todo">👤 ${escapeHtml(aName)}</span>` : ''}
            <button class="exp-btn" data-exp="${t.id}">${subs.length ? subs.length + ' subtask' + (subs.length>1?'s':'') : '+ Subtask'} ▾</button>
          </div>
          ${subs.length ? `
            <div class="progress-bar"><div class="progress-fill" style="width:${Math.round(doneCount/subs.length*100)}%"></div></div>
            <div class="progress-label">${doneCount}/${subs.length} subtasks complete</div>
          ` : ''}
          <div class="subtasks" id="subs-${t.id}">
            ${subs.map(s => subtaskHtml(s)).join('')}
            <div class="subaddbar">
              <input type="text" placeholder="Add subtask…" id="subinput-${t.id}">
              <button data-addsub="${t.id}">Add</button>
            </div>
          </div>
        </div>
        <button class="del" data-del="${t.id}">✕</button>
      </div>
    `;
    list.appendChild(row);
  });

  // wire events
  list.querySelectorAll('[data-id]').forEach(el => el.onclick = () => toggleTaskDone(el.dataset.id, data));
  list.querySelectorAll('[data-cycle]').forEach(el => el.onclick = () => cycleTaskStatus(el.dataset.cycle, data));
  list.querySelectorAll('[data-del]').forEach(el => el.onclick = () => deleteTask(el.dataset.del));
  list.querySelectorAll('[data-exp]').forEach(el => el.onclick = () => {
    document.getElementById('subs-'+el.dataset.exp).classList.toggle('open');
  });
  list.querySelectorAll('[data-addsub]').forEach(el => el.onclick = () => addSubtask(el.dataset.addsub));
  list.querySelectorAll('[data-subchk]').forEach(el => el.onclick = () => toggleTaskDone(el.dataset.subchk, data));
  list.querySelectorAll('[data-subdel]').forEach(el => el.onclick = () => deleteTask(el.dataset.subdel));
}

function subtaskHtml(s){
  return `
    <div class="subtask">
      <div class="chk ${s.status==='done'?'checked':''}" style="width:16px;height:16px;" data-subchk="${s.id}"></div>
      <div class="task-body">
        <div class="task-title" style="${s.status==='done'?'text-decoration:line-through;color:var(--muted);':''}">${escapeHtml(s.title)}</div>
      </div>
      <button class="del" data-subdel="${s.id}">✕</button>
    </div>
  `;
}

function statusLabel(s){ return s==='todo'?'To do': s==='progress'?'In progress':'Done'; }

async function toggleTaskDone(id, allTasks){
  const t = allTasks.find(x=>x.id===id);
  const newStatus = t.status === 'done' ? 'todo' : 'done';
  await sb.from('tasks').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', id);
  await loadTasks();
}
async function cycleTaskStatus(id, allTasks){
  const t = allTasks.find(x=>x.id===id);
  const next = t.status==='todo' ? 'progress' : t.status==='progress' ? 'done' : 'todo';
  await sb.from('tasks').update({ status: next, updated_at: new Date().toISOString() }).eq('id', id);
  await loadTasks();
}
async function deleteTask(id){
  await sb.from('tasks').delete().eq('id', id);
  await loadTasks();
}
async function addSubtask(parentId){
  const input = document.getElementById('subinput-'+parentId);
  const title = input.value.trim();
  if(!title) return;
  await sb.from('tasks').insert({
    project_id: currentProject.id, parent_task_id: parentId, title, created_by: currentUser.id
  });
  await loadTasks();
  setTimeout(()=>{ const s = document.getElementById('subs-'+parentId); if(s) s.classList.add('open'); }, 50);
}

/* ---------------- NOTES ---------------- */
document.getElementById('addNoteBtn').onclick = async () => {
  const input = document.getElementById('newNoteInput');
  const content = input.value.trim();
  if(!content) return;
  const { error } = await sb.from('notes').insert({ project_id: currentProject.id, content, created_by: currentUser.id });
  if(error){ showError(error.message); return; }
  input.value = '';
  await loadNotes();
};

async function loadNotes(){
  const { data, error } = await sb.from('notes').select('*').eq('project_id', currentProject.id).order('created_at', { ascending:false });
  if(error){ showError(error.message); return; }

  const list = document.getElementById('noteList');
  const empty = document.getElementById('notesEmpty');
  list.innerHTML = '';
  empty.style.display = (!data || data.length===0) ? 'block' : 'none';

  for(const n of (data||[])){
    const author = await getProfile(n.created_by);
    const div = document.createElement('div');
    div.className = 'note';
    div.innerHTML = `
      <div class="note-text">${escapeHtml(n.content)}</div>
      <div class="note-meta">
        <span class="note-author">${escapeHtml(author?.full_name || author?.email || 'Unknown')} · ${new Date(n.created_at).toLocaleString()}</span>
        <div class="note-actions">
          ${n.converted_task_id ? `<span class="note-converted">✓ Converted to task</span>` : `<button data-convert="${n.id}">Convert to task</button>`}
          <button data-notedel="${n.id}">Delete</button>
        </div>
      </div>
    `;
    list.appendChild(div);
  }

  list.querySelectorAll('[data-convert]').forEach(el => el.onclick = () => convertNoteToTask(el.dataset.convert));
  list.querySelectorAll('[data-notedel]').forEach(el => el.onclick = async () => {
    await sb.from('notes').delete().eq('id', el.dataset.notedel);
    await loadNotes();
  });
}

async function convertNoteToTask(noteId){
  const { data: note } = await sb.from('notes').select('*').eq('id', noteId).single();
  if(!note) return;
  const title = note.content.length > 120 ? note.content.slice(0,120)+'…' : note.content;
  const { data: task, error } = await sb.from('tasks').insert({
    project_id: currentProject.id, title, created_by: currentUser.id
  }).select().single();
  if(error){ showError(error.message); return; }
  await sb.from('notes').update({ converted_task_id: task.id }).eq('id', noteId);
  showOk('Converted to a task');
  await loadNotes();
  await loadTasks();
}

/* ---------------- UTIL ---------------- */
function escapeHtml(str){
  if(str==null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
